<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お知らせ | AnyTrail株式会社</title>
  <style>
    :root {
      --ink: #07090f;
      --blue: #1f6fff;
      --paper: #fbf8f1;
      --cream: #f4f0e8;
      --text: #20242d;
      --muted: #6b7280;
      --line: rgba(8, 11, 18, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--paper);
      letter-spacing: 0.01em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      border-bottom: 1px solid rgba(8,11,18,0.08);
      background: rgba(251, 248, 241, 0.9);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.logo-img {
  height: 46px;
  width: auto;
  display: block;
}

    .back-link {
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.08em;
      border: 1px solid var(--ink);
      padding: 12px 18px;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .back-link:hover {
      background: var(--ink);
      color: #fff;
    }

    .page {
      min-height: 100vh;
      padding: 110px 54px 140px;
      background:
        radial-gradient(circle at 84% 16%, rgba(31, 111, 255, 0.12), transparent 28%),
        linear-gradient(135deg, var(--paper) 0%, #f0ece4 100%);
    }

    .inner {
      max-width: 1080px;
      margin: 0 auto;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.24em;
      color: rgba(8, 11, 18, 0.5);
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--ink);
      font-size: clamp(48px, 7vw, 108px);
      line-height: 0.96;
      letter-spacing: -0.08em;
      font-weight: 950;
    }

    .lead {
      max-width: 720px;
      margin: 0 0 64px;
      font-size: 16px;
      line-height: 2;
      color: rgba(32,36,45,0.72);
      font-weight: 550;
    }

    .news-list {
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.32);
    }

    .news-item {
      display: grid;
      grid-template-columns: 160px 120px 1fr;
      gap: 32px;
      align-items: baseline;
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .news-item:hover {
      opacity: 0.72;
      transform: translateX(6px);
    }

    .date {
      font-size: 13px;
      font-weight: 900;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .cat {
      width: fit-content;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(31,111,255,0.1);
      color: var(--blue);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: 0.12em;
    }

    .title {
      font-size: 18px;
      font-weight: 850;
      letter-spacing: -0.03em;
      line-height: 1.7;
      color: var(--ink);
    }

    @media (max-width: 760px) {
  .header {
    padding: 0 24px;
  }

  .logo-img {
    height: 40px;
  }

  .page {
    padding: 80px 24px 100px;
  }

  .news-item {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 26px 0;
  }
}
  </style>
</head>

<body>
  <header class="header">
    <a href="../" class="logo">
  <img src="../assets/images/logo_1.png" alt="AnyTrail" class="logo-img">
</a>
    <a href="../" class="back-link">TOPへ戻る</a>
  </header>

  <main class="page">
    <div class="inner">
      <div class="eyebrow">NEWS</div>
      <h1>お知らせ</h1>
      <p class="lead">
        AnyTrail株式会社からのお知らせ、掲載情報、サービスに関する最新情報を掲載しています。
      </p>

      <div class="news-list">
        <a class="news-item" href="./20251203/">
          <div class="date">2025.12.03</div>
          <div class="cat">NEWS</div>
          <div class="title">タクシードライバーにおすすめ転職エージェント13選に掲載いただきました</div>
        </a>

        <a class="news-item" href="./20251127/">
          <div class="date">2025.11.27</div>
          <div class="cat">NEWS</div>
          <div class="title">タクシードライバーにおすすめ転職エージェント12選に掲載いただきました</div>
        </a>

        <a class="news-item" href="./20251118/">
          <div class="date">2025.11.18</div>
          <div class="cat">NEWS</div>
          <div class="title">タクシー業界転職エージェントおすすめ15社に掲載いただきました</div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
